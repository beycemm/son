<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Son Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Son Alan Pazaryeri</h1>
      <div class="wallet-row">
        <button id="connectWalletBtn">MetaMask ile Giriş</button>
        <span id="walletStatus">Bağlı değil</span>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <h2>Yeni Alan Oluştur</h2>
        <form id="createAreaForm">
          <input id="createAreaName" placeholder="alan-adi" required />
          <button type="submit">Alan Oluştur</button>
        </form>
      </section>

      <section class="panel">
        <h2>Alanı Satışa Koy</h2>
        <form id="sellAreaForm">
          <input id="sellAreaName" placeholder="alan-adi" required />
          <input id="sellAreaPrice" type="number" min="0.0001" step="0.0001" placeholder="Fiyat (MATIC)" required />
          <button type="submit">Satışa Koy</button>
        </form>
      </section>

      <section class="panel">
        <h2>Pazar Alanları</h2>
        <p class="hint">Her satışta platform komisyonu sabit %10.</p>
        <div id="marketGrid" class="grid"></div>
      </section>

      <section class="panel">
        <h2>İşlem Geçmişi</h2>
        <div id="txHistory"></div>
      </section>
    </main>

    <template id="listingTemplate">
      <article class="card">
        <h3 class="name"></h3>
        <p class="owner"></p>
        <p class="price"></p>
        <p class="commission"></p>
        <button class="buyBtn">MATIC ile Satın Al</button>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
