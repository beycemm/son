[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "son"
version = "0.1.0"
description = "Initial starter project scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "son contributors" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
